<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schätzmeister - Das Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0; /* Slate 200 */
            overscroll-behavior-y: none;
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        .slide-up { animation: slideUp 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .glass-panel {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-primary {
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #334155;
            color: white;
            transition: all 0.2s;
            font-size: 16px; 
        }
        .input-primary:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transition: transform 0.1s, filter 0.2s;
        }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-primary:active { transform: scale(0.97); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col md:flex-row overflow-hidden">

    <!-- Hybrid Sidebar / Navbar -->
    <nav class="flex-none md:w-80 bg-slate-800/95 border-b md:border-b-0 md:border-r border-slate-700 flex md:flex-col z-40 shadow-md backdrop-blur-md h-16 md:h-full justify-between md:justify-start">
        
        <div class="flex items-center gap-2 px-4 h-16 md:h-auto md:p-6 md:border-b md:border-slate-700/50">
            <div class="bg-blue-500/10 p-2 rounded-lg">
                <i data-lucide="brain-circuit" class="w-6 h-6 text-blue-400"></i>
            </div>
            <h1 class="font-bold text-lg md:text-xl text-slate-100 tracking-tight">Schätzmeister</h1>
        </div>

        <!-- Desktop Player List -->
        <div class="hidden md:flex flex-1 flex-col overflow-hidden">
            <div class="px-6 pt-6 pb-2">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Rangliste</h3>
            </div>
            <div id="playerListDesktop" class="flex-1 overflow-y-auto px-6 space-y-2 custom-scrollbar">
                <div class="text-sm text-slate-500 italic mt-2">Warte auf Spieler...</div>
            </div>
        </div>

        <!-- Desktop Footer -->
        <div class="hidden md:block p-4 border-t border-slate-700 bg-slate-900/30">
            <button onclick="toggleSettings()" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-white transition-all font-medium mb-2">
                <i data-lucide="settings-2" class="w-4 h-4"></i> Einstellungen
            </button>
            <button onclick="restartGame()" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 transition-all text-sm font-bold">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> Neustart
            </button>
        </div>

        <!-- Mobile Header Buttons -->
        <div class="flex items-center gap-2 px-4 md:hidden">
            <button onclick="toggleMobileScoreboard()" class="p-2 rounded-lg bg-slate-700/50 text-slate-300">
                <i data-lucide="trophy" class="w-5 h-5"></i>
            </button>
            <button onclick="toggleSettings()" class="p-2 rounded-lg bg-blue-600 text-white shadow-lg">
                <i data-lucide="settings-2" class="w-5 h-5"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-1 relative flex overflow-hidden w-full">
        
        <main class="flex-1 relative overflow-y-auto custom-scrollbar bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-4 md:p-8 w-full">
            
            <!-- SETTINGS MODAL -->
            <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 flex items-center justify-center p-4 fade-in backdrop-blur-sm">
                <div class="glass-panel w-full max-w-md rounded-2xl shadow-2xl flex flex-col max-h-[90dvh] overflow-hidden border border-slate-700">
                    <div class="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                        <h2 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="sliders" class="w-5 h-5 text-blue-400"></i> Optionen</h2>
                        <button onclick="toggleSettings()" class="p-1 rounded-full hover:bg-slate-700 text-slate-400"><i data-lucide="x" class="w-6 h-6"></i></button>
                    </div>

                    <div class="p-5 overflow-y-auto custom-scrollbar space-y-6">
                        <!-- Game Config -->
                        <div class="space-y-4">
                            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Spiel-Setup</h3>
                            <div>
                                <label class="text-xs text-slate-300 font-medium mb-1.5 block">Kategorie</label>
                                <div class="relative">
                                    <select id="categorySelect" onchange="updateSettings()" class="w-full appearance-none bg-slate-800 border border-slate-600 text-white text-sm rounded-xl focus:ring-2 focus:ring-blue-500 block p-3 pr-10 font-medium">
                                        <option value="all">✨ Alle Kategorien (Mix)</option>
                                        <option disabled>──────────</option>
                                        <option value="Allgemeines">🌍 Allgemeines</option>
                                        <option value="Geschichte">📜 Geschichte</option>
                                        <option value="Natur">🌿 Natur</option>
                                        <option value="Geografie">🗺️ Geografie</option>
                                        <option value="Südtirol">🏔️ Südtirol</option>
                                        <option value="Universum">🌌 Universum</option>
                                        <option value="Wissenschaft">🔬 Wissenschaft</option>
                                        <option value="Games">🎮 Games</option>
                                        <option value="Promis">🌟 Berühmte Persönlichkeiten</option>
                                        <option value="Lustiges">🤪 Lustige Fakten</option>
                                        <option value="Sport">⚽ Sport</option>
                                        <option value="Technik">💻 Technik</option>
                                        <option value="Film">🎬 Film & Serien</option>
                                        <option value="Tiere">🦁 Tiere</option>
                                        <option value="Musik">🎵 Musik</option>
                                        <option value="Essen">🍕 Essen & Trinken</option>
                                        <option value="Kunst">🎨 Kunst & Kultur</option>
                                        <option value="Wirtschaft">💰 Wirtschaft</option>
                                        <option value="Architektur">🏛️ Architektur</option>
                                        <option value="Literatur">📚 Literatur</option>
                                    </select>
                                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400"><i data-lucide="chevron-down" class="w-4 h-4"></i></div>
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-slate-300 font-medium mb-1.5 block">Schwierigkeit</label>
                                <div class="relative">
                                    <select id="difficultySelect" onchange="updateSettings()" class="w-full appearance-none bg-slate-800 border border-slate-600 text-white text-sm rounded-xl focus:ring-2 focus:ring-blue-500 block p-3 pr-10 font-medium">
                                        <option value="leicht">🟢 Leicht</option>
                                        <option value="mittel">🟡 Mittel</option>
                                        <option value="schwer" selected>🔴 Schwer</option>
                                        <option value="experte">🟣 Experte</option>
                                    </select>
                                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400"><i data-lucide="bar-chart-2" class="w-4 h-4"></i></div>
                                </div>
                            </div>
                        </div>

                        <!-- Rules -->
                        <div class="pt-4 border-t border-slate-700">
                            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Punktevergabe</h3>
                            <div class="grid grid-cols-4 gap-2">
                                <div class="space-y-1"><label class="text-[10px] text-slate-400 block text-center">1.</label><input type="number" id="points1Input" class="input-primary w-full p-2 rounded-lg text-center font-bold text-yellow-400 bg-slate-800" value="5" onchange="saveSettings()"></div>
                                <div class="space-y-1"><label class="text-[10px] text-slate-400 block text-center">2.</label><input type="number" id="points2Input" class="input-primary w-full p-2 rounded-lg text-center font-bold text-slate-300 bg-slate-800" value="3" onchange="saveSettings()"></div>
                                <div class="space-y-1"><label class="text-[10px] text-slate-400 block text-center">3.</label><input type="number" id="points3Input" class="input-primary w-full p-2 rounded-lg text-center font-bold text-slate-400 bg-slate-800" value="1" onchange="saveSettings()"></div>
                                <div class="space-y-1"><label class="text-[10px] text-slate-400 block text-center">Exakt</label><input type="number" id="pointsExactInput" class="input-primary w-full p-2 rounded-lg text-center font-bold text-green-400 bg-green-900/20 border-green-800" value="1" onchange="saveSettings()"></div>
                            </div>
                        </div>

                        <!-- API -->
                        <div class="pt-4 border-t border-slate-700">
                            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">KI</h3>
                            <label class="block text-xs text-slate-400 mb-1">API Key (Optional)</label>
                            <div class="flex gap-2">
                                <input type="password" id="apiKeyInput" class="flex-1 bg-slate-800 border border-slate-600 text-white text-xs rounded-lg p-2 font-mono" placeholder="AIzaSy..." onchange="saveSettings()">
                                <button onclick="testApiKey()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 rounded-lg border border-slate-600 font-medium">Testen</button>
                            </div>
                            <div id="testLog" class="mt-2 text-[10px] font-mono text-slate-400 h-16 overflow-y-auto hidden bg-black/30 p-2 rounded"></div>
                            <p id="testResult" class="text-[10px] mt-1 min-h-[1.2em] font-bold"></p>
                        </div>
                    </div>

                    <div class="p-4 border-t border-slate-700 bg-slate-900/80 flex gap-3">
                        <button onclick="restartGame()" class="flex-1 py-3 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold text-sm border border-red-500/30 md:hidden">Neustart</button>
                        <button onclick="toggleSettings()" class="flex-[2] py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg">Speichern</button>
                    </div>
                </div>
            </div>

            <!-- Phase 1: Count -->
            <div id="phase-count" class="max-w-sm mx-auto w-full h-full flex flex-col justify-center fade-in py-10">
                <div class="glass-panel p-8 rounded-3xl shadow-2xl text-center slide-up border border-slate-700">
                    <div class="w-20 h-20 bg-blue-500/10 rounded-full flex items-center justify-center mx-auto mb-6 text-blue-400 ring-1 ring-blue-500/20">
                        <i data-lucide="users" class="w-10 h-10"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2 text-white">Spieleranzahl</h2>
                    <div class="flex items-center justify-center gap-4 mb-8 mt-6">
                        <button onclick="adjustCount(-1)" class="w-12 h-12 rounded-xl bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center text-xl font-bold"><i data-lucide="minus"></i></button>
                        <input type="number" id="playerCountInput" min="1" max="20" value="2" class="bg-transparent text-center text-5xl font-black text-white w-20 outline-none" readonly>
                        <button onclick="adjustCount(1)" class="w-12 h-12 rounded-xl bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center text-xl font-bold"><i data-lucide="plus"></i></button>
                    </div>
                    <button onclick="setupNames()" class="btn-primary w-full py-4 rounded-xl font-bold text-lg shadow-lg flex items-center justify-center gap-2">
                        Weiter <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Phase 2: Names -->
            <div id="phase-names" class="hidden max-w-md mx-auto w-full h-full flex flex-col justify-center py-4">
                <div class="glass-panel p-6 rounded-3xl shadow-2xl w-full slide-up flex flex-col h-full max-h-[600px] border border-slate-700">
                    <h2 class="text-xl font-bold mb-6 text-center flex items-center justify-center gap-2"><i data-lucide="user-plus" class="w-5 h-5 text-blue-400"></i> Namen eingeben</h2>
                    <div id="nameInputsContainer" class="space-y-3 overflow-y-auto mb-6 pr-2 flex-1 custom-scrollbar"></div>
                    <button onclick="initGame()" class="btn-primary w-full py-4 rounded-xl font-bold shadow-lg text-lg mt-auto">Spiel starten 🚀</button>
                </div>
            </div>

            <!-- Phase 3: Game Loop -->
            <div id="phase-game" class="hidden flex flex-col w-full max-w-3xl mx-auto h-full justify-start pt-4 pb-32">
                <div id="ai-loading" class="hidden absolute inset-0 z-40 bg-slate-900/80 flex flex-col items-center justify-center backdrop-blur-sm rounded-xl">
                    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-6"></div>
                    <p class="text-white font-bold text-xl animate-pulse" id="loadingText">Lade Frage...</p>
                    <p class="text-sm text-slate-400 mt-2 font-mono" id="loadingSource">...</p>
                </div>

                <div class="glass-panel rounded-3xl p-6 md:p-10 border border-slate-700/50 shadow-2xl relative overflow-hidden mb-6 flex-shrink-0">
                    <div class="absolute top-0 right-0 p-4 opacity-10 pointer-events-none"><i data-lucide="brain-circuit" class="w-24 h-24 md:w-32 md:h-32"></i></div>
                    
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 md:mb-6 gap-3 relative z-10">
                        <div class="flex flex-wrap items-center gap-2">
                            <span id="categoryBadge" class="px-3 py-1 bg-blue-500/10 text-blue-300 rounded-lg text-[10px] font-bold tracking-wider uppercase border border-blue-500/20">Kategorie</span>
                            <span id="difficultyBadge" class="px-3 py-1 bg-orange-500/10 text-orange-300 rounded-lg text-[10px] font-bold tracking-wider uppercase border border-orange-500/20">Schwer</span>
                            <span id="liveBadge" class="hidden px-3 py-1 bg-green-500/10 text-green-300 rounded-lg text-[10px] font-bold tracking-wider uppercase border border-green-500/20 flex items-center gap-1"><i data-lucide="zap" class="w-3 h-3"></i> LIVE</span>
                        </div>
                        <button id="skipButton" onclick="skipQuestion()" class="w-full md:w-auto justify-center text-xs font-bold text-slate-400 hover:text-white flex items-center gap-2 bg-slate-800/80 hover:bg-slate-700 px-4 py-2 rounded-lg transition-all border border-slate-700/50 active:scale-95">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Neue Frage
                        </button>
                    </div>
                    
                    <h2 id="questionText" class="text-xl md:text-3xl font-bold leading-tight mb-6 text-white relative z-10 drop-shadow-lg">Frage wird geladen...</h2>
                    
                    <div class="flex flex-col md:flex-row justify-between items-stretch md:items-end gap-4 relative z-10 mt-auto">
                        <div class="bg-slate-900/40 px-4 py-2 rounded-lg border border-slate-700/50 inline-flex items-center gap-2 self-start">
                            <i data-lucide="scale" class="w-4 h-4 text-slate-400"></i> 
                            <span class="text-slate-400 text-xs uppercase font-bold">Gesucht:</span>
                            <span id="unitText" class="text-white font-bold text-sm">Einheit</span>
                        </div>
                    </div>
                </div>

                <div id="inputArea" class="w-full glass-panel rounded-t-3xl md:rounded-3xl p-6 flex-1 flex flex-col justify-center border-t border-slate-700 shadow-[0_-10px_40px_rgba(0,0,0,0.3)] slide-up mt-auto">
                    <div id="playerTurnIndicator" class="text-center text-lg font-bold mb-6 text-yellow-400 flex items-center justify-center gap-2">
                        <span class="w-2 h-2 bg-yellow-400 rounded-full animate-pulse"></span> Spieler X ist dran
                    </div>
                    <div id="hiddenInputState" class="text-center py-4">
                        <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-500 border border-slate-700"><i data-lucide="eye-off" class="w-8 h-8"></i></div>
                        <p class="text-slate-300 text-sm mb-8">Gerät übergeben an <span id="nextPlayerName" class="font-bold text-white text-lg block mt-1">...</span></p>
                        <button onclick="revealInput()" class="bg-slate-700 hover:bg-slate-600 text-white px-8 py-4 rounded-xl font-bold w-full border border-slate-600 shadow-lg active:scale-95 text-lg">Ich bin bereit!</button>
                    </div>
                    <div id="activeInputState" class="hidden">
                        <input type="number" id="gameGuessInput" class="w-full bg-slate-900/80 border-2 border-slate-600 text-white text-center text-4xl font-bold py-6 rounded-2xl mb-4 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none transition-all" placeholder="?" step="any">
                        <button onclick="submitGuess()" class="btn-primary w-full py-4 rounded-xl font-bold text-xl shadow-lg active:scale-95 flex items-center justify-center gap-2">Tipp abgeben <i data-lucide="check-circle" class="w-6 h-6"></i></button>
                    </div>
                </div>
            </div>

            <!-- Phase 4: Results (SCROLLBAR FIX) -->
            <div id="phase-results" class="hidden w-full max-w-3xl mx-auto h-full flex flex-col justify-start pt-4 pb-20">
                <div class="glass-panel p-6 md:p-10 rounded-3xl shadow-2xl w-full slide-up border border-slate-700 relative flex flex-col h-auto max-h-full">
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-green-500/20 via-transparent to-transparent pointer-events-none"></div>
                    
                    <div class="text-center mb-6 relative z-10 flex-shrink-0">
                        <div class="inline-block px-4 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-4">Lösung</div>
                        <div class="text-4xl md:text-7xl font-black text-green-400 mb-1 tracking-tight" id="correctAnswerDisplay">0</div>
                        <div class="text-lg text-slate-300 font-medium" id="resultUnitDisplay">Einheit</div>
                    </div>

                    <!-- Scrollable List Area -->
                    <div class="flex-1 overflow-y-auto custom-scrollbar mb-6 min-h-0 pr-2" id="roundRanking">
                        <!-- Ranking Items -->
                    </div>

                    <!-- Fixed Footer Button -->
                    <div class="flex-shrink-0 pt-2">
                        <button onclick="nextQuestion()" class="btn-primary w-full py-4 rounded-xl font-bold text-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 bg-blue-600 text-white relative z-20">
                            Nächste Runde <i data-lucide="arrow-right-circle" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>
            </div>

        </main>

        <!-- Mobile Scoreboard -->
        <div id="scoreboardOverlay" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-sm" onclick="toggleMobileScoreboard()"></div>
        <aside id="mobileScoreboard" class="fixed inset-y-0 right-0 w-72 bg-slate-900 border-l border-slate-800 shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-bold text-slate-100 flex items-center gap-2"><i data-lucide="trophy" class="text-yellow-500"></i> Rangliste</h3>
                <button onclick="toggleMobileScoreboard()" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
            </div>
            <div id="playerListMobile" class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar"></div>
        </aside>

    </div>

    <script>
        const CATEGORIES = ["Geschichte", "Natur", "Geografie", "Südtirol", "Universum", "Wissenschaft", "Games", "Promis", "Lustiges", "Sport", "Weltraum", "Technik", "Film", "Tiere", "Musik", "Essen", "Kunst", "Wirtschaft", "Architektur", "Literatur", "Allgemeines"];
        const fullQuestionPool = [
            { c: "Südtirol", q: "Wie hoch ist der Ortler?", a: 3905, u: "Meter" },
            { c: "Games", q: "Wann erschien Super Mario Bros. (Japan)?", a: 1985, u: "Jahr" },
            { c: "Natur", q: "Wie viele Beine hat ein Tausendfüßler (max)?", a: 750, u: "Beine" },
            { c: "Geografie", q: "Wie lang ist der Nil?", a: 6650, u: "km" },
            { c: "Wissenschaft", q: "Wie schnell ist Licht (km/s, ca)?", a: 299792, u: "km/s" }
        ];

        let state = {
            players: [],
            currentQuestionIndex: -1,
            currentPlayerIndex: 0,
            usedQuestions: [],
            currentQ: null,
            currentCategoryFilter: 'all',
            currentDifficulty: 'schwer',
            apiKey: localStorage.getItem('gemini_api_key') || '',
            workingModel: null,
            currentLoadId: 0,
            points: {
                p1: parseInt(localStorage.getItem('pts_p1')) || 5,
                p2: parseInt(localStorage.getItem('pts_p2')) || 3,
                p3: parseInt(localStorage.getItem('pts_p3')) || 1,
                exact: parseInt(localStorage.getItem('pts_exact')) || 1
            }
        };

        function adjustCount(delta) {
            const input = document.getElementById('playerCountInput');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            if (val > 20) val = 20;
            input.value = val;
        }

        function toggleSettings() {
            const m = document.getElementById('settings-modal');
            m.classList.toggle('hidden');
            if(!m.classList.contains('hidden')) {
                document.getElementById('apiKeyInput').value = state.apiKey;
                document.getElementById('points1Input').value = state.points.p1;
                document.getElementById('points2Input').value = state.points.p2;
                document.getElementById('points3Input').value = state.points.p3;
                document.getElementById('pointsExactInput').value = state.points.exact;
                document.getElementById('categorySelect').value = state.currentCategoryFilter;
                document.getElementById('difficultySelect').value = state.currentDifficulty;
            }
        }

        function toggleMobileScoreboard() {
            const sb = document.getElementById('mobileScoreboard');
            const ov = document.getElementById('scoreboardOverlay');
            if(sb.classList.contains('translate-x-full')) {
                sb.classList.remove('translate-x-full');
                ov.classList.remove('hidden');
            } else {
                sb.classList.add('translate-x-full');
                ov.classList.add('hidden');
            }
        }

        function saveSettings() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key !== state.apiKey) {
                state.apiKey = key;
                localStorage.setItem('gemini_api_key', key);
                state.workingModel = null;
            }
            state.points.p1 = parseInt(document.getElementById('points1Input').value) || 0;
            state.points.p2 = parseInt(document.getElementById('points2Input').value) || 0;
            state.points.p3 = parseInt(document.getElementById('points3Input').value) || 0;
            state.points.exact = parseInt(document.getElementById('pointsExactInput').value) || 0;
            localStorage.setItem('pts_p1', state.points.p1);
            localStorage.setItem('pts_p2', state.points.p2);
            localStorage.setItem('pts_p3', state.points.p3);
            localStorage.setItem('pts_exact', state.points.exact);
            updateSettings();
        }

        function updateSettings() {
            state.currentCategoryFilter = document.getElementById('categorySelect').value;
            state.currentDifficulty = document.getElementById('difficultySelect').value;
        }

        async function findWorkingModel(key) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                if (!response.ok) return null;
                const data = await response.json();
                if (!data.models) return null;
                const capable = data.models.filter(m => m.supportedGenerationMethods?.includes("generateContent"));
                if (capable.length === 0) return null;
                const sorted = capable.sort((a, b) => {
                    const na = a.name.toLowerCase(), nb = b.name.toLowerCase();
                    if(na.includes('flash') && !nb.includes('flash')) return -1;
                    if(!na.includes('flash') && nb.includes('flash')) return 1;
                    return 0;
                });
                for (const m of sorted) {
                    const mid = m.name.replace("models/", "");
                    try {
                        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${mid}:generateContent?key=${key}`, {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ contents: [{ parts: [{ text: "1" }] }] })
                        });
                        if(r.ok) return mid;
                    } catch(e){}
                }
            } catch (e) { return null; }
            return null;
        }

        async function testApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            const res = document.getElementById('testResult');
            const log = document.getElementById('testLog');
            log.classList.remove('hidden');
            log.innerHTML = "Suche...";
            
            if(key.length < 5) { res.innerHTML = "Zu kurz"; return; }

            const model = await findWorkingModel(key);
            if(model) {
                state.workingModel = model;
                log.innerHTML = `OK: ${model}`;
                res.innerHTML = "<span class='text-green-400'>Verbunden!</span>";
            } else {
                log.innerHTML = "Kein Modell gefunden";
                res.innerHTML = "<span class='text-red-400'>Fehler</span>";
            }
        }

        async function fetchLiveQuestion(category, loadId) {
            let actualCategory = category === 'all' ? CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)] : category;
            const cleanKey = state.apiKey.trim();
            if (!state.workingModel) {
                const m = await findWorkingModel(cleanKey);
                state.workingModel = m || 'gemini-1.5-flash';
            }
            const diffMap = { 'leicht': 'SEHR EINFACH', 'mittel': 'MITTEL', 'schwer': 'SCHWER', 'experte': 'EXTREM SCHWER' };
            const prompt = `Quizfrage erstellen. Kategorie: "${actualCategory}". Schwierigkeit: ${diffMap[state.currentDifficulty]}. Regeln: Fakt muss eine ZAHL sein (Höhe, Jahr, Anzahl). KEINE Mathe-Rätsel. Antwort GANZE ZAHL. JSON Format: { "q": "Fragetext?", "a": 1234, "u": "Einheit" }`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${state.workingModel}:generateContent?key=${cleanKey}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if(loadId !== state.currentLoadId) return { error: "Aborted" };
                if (!response.ok) throw new Error(`API ${response.status}`);
                const data = await response.json();
                let text = data.candidates[0].content.parts[0].text;
                const first = text.indexOf('{'), last = text.lastIndexOf('}');
                if(first === -1) throw new Error("JSON Error");
                const qData = JSON.parse(text.substring(first, last + 1));
                return { c: actualCategory, q: qData.q, a: parseFloat(qData.a), u: qData.u, isLive: true };
            } catch (e) { return { error: e.message }; }
        }

        function showPhase(id) {
            ['phase-count', 'phase-names', 'phase-game', 'phase-results'].forEach(pid => {
                document.getElementById(pid).classList.add('hidden');
                document.getElementById(pid).classList.remove('fade-in');
            });
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('fade-in');
        }

        function setupNames() {
            const count = parseInt(document.getElementById('playerCountInput').value);
            const c = document.getElementById('nameInputsContainer');
            c.innerHTML = '';
            for(let i=0; i<count; i++) {
                c.innerHTML += `<div class="flex gap-2"><span class="text-slate-400 w-6 text-right pt-4">${i+1}.</span><input type="text" class="input-primary flex-1 p-4 rounded-xl player-name-input text-lg" value="Spieler ${i+1}"></div>`;
            }
            showPhase('phase-names');
        }

        function initGame() {
            const inputs = document.querySelectorAll('.player-name-input');
            state.players = Array.from(inputs).map(i => ({ name: i.value.trim(), score: 0 }));
            updateScoreboard();
            nextQuestion();
        }

        async function nextQuestion() {
            state.currentLoadId++;
            const myLoadId = state.currentLoadId;
            try {
                showPhase('phase-game');
                document.getElementById('ai-loading').classList.remove('hidden');
                document.getElementById('loadingText').innerText = "Lade Frage...";
                document.getElementById('loadingSource').innerText = "Bitte warten...";
                document.getElementById('gameGuessInput').value = '';
                state.currentPlayerIndex = 0;
                state.players.forEach(p => p.currentGuess = null);
                let questionLoaded = null;
                if(state.apiKey.length > 10) {
                    document.getElementById('loadingText').innerText = `Frage KI (${state.currentDifficulty})...`;
                    const res = await fetchLiveQuestion(state.currentCategoryFilter, myLoadId);
                    if(state.currentLoadId !== myLoadId) return; 
                    if(res && !res.error) questionLoaded = res;
                    else {
                        document.getElementById('loadingSource').innerText = "Fehler: " + (res?.error || "Timeout");
                        await new Promise(r => setTimeout(r, 800));
                    }
                }
                if(state.currentLoadId !== myLoadId) return;
                if(!questionLoaded) {
                    document.getElementById('loadingSource').innerText = "Nutze Offline-Pool";
                    let pool = fullQuestionPool;
                    if(state.currentCategoryFilter !== 'all') pool = fullQuestionPool.filter(q => q.c === state.currentCategoryFilter);
                    if(pool.length === 0) pool = fullQuestionPool;
                    questionLoaded = pool[Math.floor(Math.random() * pool.length)];
                }
                state.currentQ = questionLoaded;
                document.getElementById('questionText').innerText = state.currentQ.q;
                document.getElementById('unitText').innerText = state.currentQ.u;
                document.getElementById('categoryBadge').innerText = state.currentQ.c;
                document.getElementById('difficultyBadge').innerText = state.currentDifficulty;
                const liveBadge = document.getElementById('liveBadge');
                if(state.currentQ.isLive) liveBadge.classList.remove('hidden'); else liveBadge.classList.add('hidden');
                document.getElementById('ai-loading').classList.add('hidden');
                setupTurn();
            } catch(e) {
                console.error(e);
                if(state.currentLoadId === myLoadId) {
                    state.currentQ = fullQuestionPool[0];
                    document.getElementById('ai-loading').classList.add('hidden');
                    setupTurn();
                }
            }
        }

        function skipQuestion() {
            const btn = document.getElementById('skipButton');
            if (btn.dataset.confirm === "true") {
                btn.dataset.confirm = "false";
                btn.innerHTML = '<i data-lucide="refresh-cw" class="w-4 h-4"></i> Neue Frage';
                btn.classList.remove('text-red-400');
                nextQuestion();
            } else {
                btn.dataset.confirm = "true";
                btn.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4"></i> Sicher?';
                btn.classList.add('text-red-400');
                setTimeout(() => {
                    btn.dataset.confirm = "false";
                    btn.innerHTML = '<i data-lucide="refresh-cw" class="w-4 h-4"></i> Neue Frage';
                    btn.classList.remove('text-red-400');
                    lucide.createIcons();
                }, 3000);
            }
            lucide.createIcons();
        }

        function setupTurn() {
            const p = state.players[state.currentPlayerIndex];
            document.getElementById('playerTurnIndicator').innerHTML = `<span class="text-blue-400 font-bold text-xl">${p.name}</span> ist dran`;
            document.getElementById('nextPlayerName').innerText = p.name;
            document.getElementById('hiddenInputState').classList.remove('hidden');
            document.getElementById('activeInputState').classList.add('hidden');
            document.getElementById('gameGuessInput').value = '';
        }

        function revealInput() {
            document.getElementById('hiddenInputState').classList.add('hidden');
            document.getElementById('activeInputState').classList.remove('hidden');
            document.getElementById('gameGuessInput').focus();
        }

        function submitGuess() {
            const val = parseFloat(document.getElementById('gameGuessInput').value.replace(',', '.'));
            if(isNaN(val)) return alert("Bitte Zahl eingeben");
            state.players[state.currentPlayerIndex].currentGuess = val;
            state.currentPlayerIndex++;
            if(state.currentPlayerIndex >= state.players.length) calculateResults(); else setupTurn();
        }

        function calculateResults() {
            const ans = state.currentQ.a;
            state.players.forEach(p => {
                p.lastDiff = Math.abs(p.currentGuess - ans);
                p.isExact = p.lastDiff === 0;
            });
            const ranked = [...state.players].sort((a,b) => a.lastDiff - b.lastDiff);
            let rank = 1;
            for(let i=0; i<ranked.length; i++) {
                if(i > 0 && ranked[i].lastDiff !== ranked[i-1].lastDiff) rank = i + 1;
                let pts = 0;
                if(rank === 1) pts = state.points.p1;
                else if(rank === 2) pts = state.points.p2;
                else if(rank === 3) pts = state.points.p3;
                if(ranked[i].isExact) pts += state.points.exact;
                ranked[i].lastPoints = pts;
                ranked[i].score += pts;
            }
            document.getElementById('correctAnswerDisplay').innerText = ans.toLocaleString();
            document.getElementById('resultUnitDisplay').innerText = state.currentQ.u;
            const list = document.getElementById('roundRanking');
            list.innerHTML = '';
            ranked.forEach(p => {
                const diff = p.isExact ? "TREFFER!" : `Diff: ${p.lastDiff.toLocaleString()}`;
                const cls = p.lastPoints > 0 ? 'bg-green-900/20 border-green-500/30' : 'bg-slate-800/50 border-slate-700';
                const txt = p.lastPoints > 0 ? 'text-green-400' : 'text-slate-500';
                list.innerHTML += `
                <div class="flex justify-between p-4 rounded-xl border ${cls} items-center mb-2">
                    <div><div class="font-bold text-white text-lg">${p.name}</div><div class="text-xs text-slate-400">${p.currentGuess.toLocaleString()} | ${diff}</div></div>
                    <div class="text-3xl font-black ${txt}">+${p.lastPoints}</div>
                </div>`;
            });
            updateScoreboard();
            showPhase('phase-results');
        }

        function updateScoreboard() {
            const desktopList = document.getElementById('playerListDesktop');
            if(desktopList) desktopList.innerHTML = renderPlayerListItems();
            const mobileList = document.getElementById('playerListMobile');
            if(mobileList) mobileList.innerHTML = renderPlayerListItems();
        }

        function renderPlayerListItems() {
            let html = '';
            [...state.players].sort((a,b) => b.score - a.score).forEach((p, i) => {
                const lead = i===0 && p.score > 0 ? 'border-yellow-500/50 bg-yellow-500/10 text-yellow-200' : 'border-slate-700 bg-slate-800/50 text-slate-300';
                html += `<div class="p-3 rounded-lg border flex justify-between items-center ${lead} mb-2">
                    <div class="flex items-center gap-3"><span class="text-xs font-bold opacity-50">#${i+1}</span><span class="font-bold">${p.name}</span></div>
                    <span class="font-mono font-bold text-lg">${p.score}</span>
                </div>`;
            });
            return html;
        }

        function restartGame() {
            if(confirm("Spiel neustarten?")) location.reload();
        }

        lucide.createIcons();
    </script>
</body>
</html>
